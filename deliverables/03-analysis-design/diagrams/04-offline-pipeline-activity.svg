<text x="375" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• كل إحصاء من التدريب ≤ t0 وحده (§5.9).</text>
<text x="375" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• لا تحليل حكمي على (عرض × قطع).</text>
<text x="375" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• تقرير زمن/ذاكرة لكل (نموذج، زوج، طور).</text>
<text x="375" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• ميزانية ≤ 8 ساعات CPU للتطوير ولـE10.</text>
<text x="375" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• سلّم تقليص مسجل قبل التجميد فقط.</text>
