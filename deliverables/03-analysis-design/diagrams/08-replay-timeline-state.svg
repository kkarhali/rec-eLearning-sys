<text x="1240" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">قاعدة اللقطة: s(t) = max{ s ∈ S_p : s ≤ t }،  S_p = {28, 42, …} ∩ [28, L_p − 14]  ← هنا s(75) = 70؛ وإن t &lt; 28 فلا لقطة (422 day_before_first_snapshot).</text>
<text x="1240" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">قاعدة الخطر: c(t) = max{ c ∈ {28, 56, 112} : c ≤ t } ← هنا c(75) = 56؛ وإن t &lt; 28 فـ risk = null («لا تقدير»). العنقود يُحسب عند s نفسها (D-39).</text>
<text x="1240" y="474" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">السياق المعروض: التقييم القادم بعد s = 70 هو TMA في اليوم 96 (بعد 26 يوماً، الفئة &gt; 14)؛ والاستجابة تعلن requested_day وsnapshot_day معاً.</text>
<text x="1240" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">المعاملات عند لقطة غير بروتوكولية تُؤخذ من أقرب أصل سابق (70 لما قبله)؛ والمخرجات للعرض فقط ولا يُشتق منها رقم في الرسالة.</text>
