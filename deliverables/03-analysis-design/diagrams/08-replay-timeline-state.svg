<rect x="40" y="406" width="1220" height="172" rx="8" fill="#F8FAFC" stroke="#7F8A9C" stroke-width="1.5"/>
<text x="1240" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">(1) الثقيلة (WRMF، GRU-lite): معاملات أقرب قطع c لا يتجاوز t؛ هنا c(75) = 70. (2) حالة المتعلم عند t: fold-in لـ x_u بـ Y الثابتة، وتمرير GRU أمامي.</text>
<text x="1240" y="457" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">(3) الخفيفة (Recent-Pop، SKNN، Markov، Item-kNN، CBF، C6، C7) تُحسب عند t. (4) أوزان الهجين أوزان القطع c.</text>
<text x="1240" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">(5) قبل اليوم 70: الخفيفة وحدها بأوزان مُعاد تطبيعها مع إشعار. (6) model_cut في كل استجابة. (7) لا رقم تقييم منها.</text>
<text x="1240" y="507" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">الخطر: tc(t) أكبر قطع من 28 و56 و112 لا يتجاوز t، وقبل اليوم 28 لا تقدير. العناقيد: نموذج اليوم 56، وتُعرض من اليوم 56.</text>
<text x="1240" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">الحالي: HYB* = C7 + SKNN بلا مكوّن ثقيل (D-51)؛ وC7 يقرأ k والوسوم المحفوظة لليوم t نفسه (D-68).</text>
<text x="1240" y="557" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">السياق: التقييم القادم بعد t = 75 هو TMA في اليوم 96 (بعد 21 يوماً).</text>
