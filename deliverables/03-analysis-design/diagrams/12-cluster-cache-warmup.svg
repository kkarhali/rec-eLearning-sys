<text x="1250" y="870" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• تحفيظ لا لقطة: القيمة محسوبة عند اليوم t نفسه وبالدالة نفسها، ولا تُستعمل ليوم آخر؛ فلا يتعارض مع D-49.</text>
<text x="1250" y="894" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• ممنوع تخفيض n_init أو البذور أو مدى k في الخدمة لتسريعها، لأن ذلك يغيّر المكوّن (7) عمّا قُيِّم.</text>
<text x="1250" y="918" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• NFR-01: p95 حتى 200 مللي ثانية للتوصيات وملف المتعلم في الأيام المسخَّنة، وحتى ثانية للنظرة العامة والجدول.</text>
<text x="1250" y="942" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• الذاكرة خارج git ويعاد بناؤها بالتسخين؛ ويعرض الشريط مؤشر تقدّم حين يكون الطلب بارداً.</text>
<text x="1250" y="966" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start" direction="rtl">• serving.py خارج نطاق التجميد (D-69)، والتحفيظ يستورد الدوال المجمَّدة للقراءة فقط.</text></svg>
